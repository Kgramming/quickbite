name: quickbite
description: "QuickBite - Food Delivery Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & Networking
  dio: ^5.3.0
  retrofit: ^4.0.0
  
  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Serialization
  json_serializable: ^6.7.0
  json_annotation: ^4.8.1
  
  # UI & Navigation
  go_router: ^11.0.0
  flutter_localizations:
    sdk: flutter
  
  # Date & Time
  intl: ^0.18.0
  
  # Validation
  form_validator: ^0.5.1
  
  # Logging
  logger: ^2.0.1
  
  # Utils
  uuid: ^4.0.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  
  # Code Generation
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  retrofit_generator: ^8.0.0
  
  # Testing
  mocktail: ^1.0.0
  
flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
