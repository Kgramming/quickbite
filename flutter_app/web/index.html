<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="QuickBite — food delivery, 8 restaurants, 160 dishes.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QuickBite">
  <link rel="apple-touch-icon" href="icons/qb-Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>QuickBite</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #1b4332; }
    #qb-splash {
      position: fixed; inset: 0; background: #1b4332;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 18px; z-index: 9999;
      transition: opacity .4s ease;
    }
    #qb-splash.hide { opacity: 0; pointer-events: none; }
    #qb-splash img { width: 120px; height: 120px; border-radius: 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,.35); }
    #qb-splash .qb-name { color: #fdf6ec; font-family: -apple-system, sans-serif;
      font-size: 28px; font-weight: 700; letter-spacing: 1px; }
    #qb-splash .qb-spin {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(253,246,236,.25);
      border-top-color: #d97742; animation: qb-spin 0.9s linear infinite;
    }
    @keyframes qb-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="qb-splash">
    <img src="icons/qb-Icon-192.png" alt="QuickBite">
    <div class="qb-name">QuickBite</div>
    <div class="qb-spin"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('qb-splash');
      if (s) { s.classList.add('hide'); setTimeout(function(){ s.remove(); }, 500); }
    });
    // Fallback: never trap the user on the splash
    setTimeout(function () {
      var s = document.getElementById('qb-splash');
      if (s) { s.classList.add('hide'); setTimeout(function(){ s.remove(); }, 500); }
    }, 12000);
  </script>
</body>
</html>
